{{- /* One ServiceAccount per workload identity. infra/aks.bicep federates each managed
       identity with system:serviceaccount:<namespace>:<key>-sa. */}}
{{- range $key, $id := .Values.azure.identities }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai.serviceAccountName" $key }}
  labels:
    {{- include "ai.labels" $ | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ required (printf "azure.identities.%s.clientId is required" $key) $id.clientId | quote }}
    azure.workload.identity/tenant-id: {{ required "azure.tenantId is required" $.Values.azure.tenantId | quote }}
automountServiceAccountToken: false
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai.serviceAccountName" "" }}
  labels:
    {{- include "ai.labels" . | nindent 4 }}
automountServiceAccountToken: false
