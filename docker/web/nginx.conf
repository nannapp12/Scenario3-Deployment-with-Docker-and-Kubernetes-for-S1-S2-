server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;          # /hr -> /hr/ without leaking the container port

    # TLS and HSTS are handled by the Ingress.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Scenario2/web links to Container Apps sign-in (/.auth/login/aad) on a 401.
    # On AKS, sign-in is oauth2-proxy; it only accepts relative redirect targets.
    location = /.auth/login/aad {
        return 302 /oauth2/start?rd=$arg_post_login_redirect_uri;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
